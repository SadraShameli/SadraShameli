name: README cards

# Rebuilds the data-driven cards (GitHub stats + SensorHub readings) and
# force-pushes them to the orphan `output` branch, so main's history stays clean.

on:
  push:
    branches: [main]
    paths:
      - "Scripts/**"
      - ".github/workflows/readme.yml"
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore the last published cards
        # a source that fails this run keeps its previous card
        run: |
          mkdir -p dist
          if git fetch --depth=1 origin output; then
            git archive FETCH_HEAD | tar -x -C dist
          fi

      - name: Build cards
        env:
          # Optional: a fine-grained PAT in STATS_TOKEN also counts private contributions/repos.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          STATS_LOGIN: ${{ github.repository_owner }}
        run: python3 Scripts/readme live --out dist

      - name: Publish to the output branch
        working-directory: dist
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update README cards"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
