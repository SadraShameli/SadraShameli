[project]
name = "readme"
version = "0.1.0"
description = "Draws my GitHub profile README and every card on it"
readme = "README.md"
authors = [
    { name = "SadraShameli", email = "sadra.shameli1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "pillow>=12.3.0",
]

[project.scripts]
readme = "readme.main:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-random-order>=1.2.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
fix = true
indent-width = 4
line-length = 79

[tool.ruff.lint]
extend-select = [
    "B",
    "E",
    "ERA",
    "F",
    "I",
    "PL",
    "PTH",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "E501",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
]

[tool.ruff.analyze]
detect-string-imports = true

[tool.pytest.ini_options]
addopts = "--random-order -n auto --timeout=120"
testpaths = ["tests"]
