[project]
name = "readme"
version = "0.1.0"
description = "Draws the SVG cards for my GitHub profile README"
readme = "README.md"
authors = [
    { name = "SadraShameli", email = "sadra.shameli1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
readme = "readme:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
    "ty>=0.0.84",
]

[tool.ruff]
fix = true
indent-width = 4
line-length = 79

[tool.ruff.lint]
extend-select = [
    "B",
    "E",
    "ERA",
    "F",
    "I",
    "PL",
    "PTH",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "TRY",
    "UP",
    "W",
]
ignore = [
    # the drawing helpers take x, y, w, h positionally, like SVG itself
    "PLR0917",
    "E501",
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
]
